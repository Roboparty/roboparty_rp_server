# RoboParty RP Server — server config
transports:
  ws: true
  serial: false
  bluetooth: false
  udp: true               # App gamepad → rp_server UDP channel

server:
  host: "0.0.0.0"
  port: 8765
  # true: skip hardware pybind, push synthetic telemetry (dev / CI)
  mock: false

hardware:
  # Normal service stays available in degraded mode when devices are unplugged.
  # Use --require-hardware during hardware acceptance testing.
  required: ["motors", "imu", "bms"]
  fail_startup_if_unavailable: false

serial:
  port: "/dev/ttyAMA0"
  baudrate: 115200

bluetooth:
  channel: 1

udp:
  host: "0.0.0.0"
  port: 9000

bms:
  bms_type: "TWS"
  socket_path: "/tmp/bms.sock"

telemetry:
  imu_hz: 100
  battery_hz: 1
  error_hz: 10

auth:
  enabled: true
  # HS256 secret — override via RP_JWT_SECRET in production
  jwt_secret: "roboparty-dev-secret-change-me"
  jwt_ttl_sec: 86400
  qr_ttl_sec: 120
  # When true, /chat and MCP write tools require Bearer token
  require_token: false

chat:
  enabled: true
  # API Key: set RP_DEEPSEEK_API_KEY in .env (gitignored). Never commit keys.
  api_key: ""
  api_base: "https://api.deepseek.com/v1"
  model: "deepseek-v4-flash"   # default: fast / cost-efficient
  models:
    - id: "deepseek-v4-flash"
      label: "V4 Flash"
    - id: "deepseek-v4-pro"
      label: "V4 Pro"
  max_history: 20
  inject_robot_context: true

mcp:
  enabled: true
  # When true, only sysinfo/conn/err/policy_status (no start/stop/btn)
  readonly: true

gamepad:
  # Default WS target for on-board bridge
  ws_url: "ws://127.0.0.1:8765/ws"
