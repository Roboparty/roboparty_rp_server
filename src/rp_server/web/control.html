<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RoboParty · Gamepad</title>
<link rel="stylesheet" href="/ui/tokens.css" />
<link rel="stylesheet" href="/ui/common.css" />
</head>
<body>
<div class="shell">
  <!-- ── Nav ────────────────────────────────────────────── -->
  <nav class="nav">
    <div class="nav-brand">Robo<em>Party</em></div>
    <div class="nav-links">
      <a href="/" data-i18n="nav.home">Home</a>
      <a class="active" href="/control" data-i18n="nav.control">Gamepad</a>
      <a href="/chat-ui" data-i18n="nav.chat">Chat</a>
    </div>
    <div class="nav-tools">
      <button class="tool-btn" id="themeBtn" data-i18n-title="toolbar.theme" title="Toggle Theme" aria-label="Toggle theme">
        <span class="tool-icon" id="themeIcon">☀️</span>
      </button>
      <button class="tool-btn" id="langBtn" data-i18n-title="toolbar.lang" title="Switch language" aria-label="Switch language">
        <span id="langLabel">EN</span>
      </button>
      <span id="wsPill" class="pill bad"><span class="dot"></span><span data-i18n="nav.connecting">Connecting</span></span>
    </div>
  </nav>

  <main class="page">
    <h1 class="page-title" data-i18n="control.title">Virtual Gamepad</h1>
    <p class="page-sub" data-i18n="control.sub">Operate as a real gamepad. Press sends AT+BTN, drag sticks send AT+JOY.</p>

    <div class="pad-stage">
      <!-- Xbox-like SVG gamepad -->
      <div class="pad-svg-wrap">
        <svg class="gamepad" viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
          <path class="shell" d="M90 120 C90 70 140 45 200 45 L360 45 C420 45 470 70 470 120
            L495 230 C505 270 480 295 445 285 L360 255 L200 255 L115 285
            C80 295 55 270 65 230 Z"/>
          <ellipse class="grip" cx="105" cy="230" rx="55" ry="70"/>
          <ellipse class="grip" cx="455" cy="230" rx="55" ry="70"/>

          <!-- bumpers -->
          <rect id="btn-lb" class="bump" data-btn="lb" x="150" y="28" width="90" height="22" rx="8"/>
          <rect id="btn-rb" class="bump" data-btn="rb" x="320" y="28" width="90" height="22" rx="8"/>
          <text class="lbl" x="195" y="40" style="font-size:11px;fill:#9aa3b5">LB</text>
          <text class="lbl" x="365" y="40" style="font-size:11px;fill:#9aa3b5">RB</text>

          <!-- d-pad -->
          <g transform="translate(145 145)">
            <rect class="face" data-btn="du" x="-12" y="-36" width="24" height="28" rx="4"/>
            <rect class="face" data-btn="dd" x="-12" y="8" width="24" height="28" rx="4"/>
            <rect class="face" data-btn="dl" x="-36" y="-12" width="28" height="24" rx="4"/>
            <rect class="face" data-btn="dr" x="8" y="-12" width="28" height="24" rx="4"/>
          </g>

          <!-- ABXY -->
          <g transform="translate(400 145)">
            <circle class="face" data-btn="y" cx="0" cy="-32" r="16"/>
            <circle class="face" data-btn="a" cx="0" cy="32" r="16"/>
            <circle class="face" data-btn="x" cx="-32" cy="0" r="16"/>
            <circle class="face" data-btn="b" cx="32" cy="0" r="16"/>
            <text class="lbl" x="0" y="-32">Y</text>
            <text class="lbl" x="0" y="32">A</text>
            <text class="lbl" x="-32" y="0">X</text>
            <text class="lbl" x="32" y="0">B</text>
          </g>

          <!-- left stick -->
          <g id="lstick" transform="translate(210 210)">
            <circle class="stick-base" r="38"/>
            <circle id="lknob" class="stick-knob" r="22"/>
          </g>
          <!-- right stick -->
          <g id="rstick" transform="translate(330 210)">
            <circle class="stick-base" r="38"/>
            <circle id="rknob" class="stick-knob" r="22"/>
          </g>

          <!-- center buttons -->
          <circle class="face" data-btn="select" cx="250" cy="120" r="8"/>
          <circle class="face" data-btn="start" cx="310" cy="120" r="8"/>
        </svg>
        <p class="hint" id="joyHint" data-i18n="control.hint">Drag sticks · Click buttons</p>
      </div>

      <!-- Log panel -->
      <div class="panel">
        <h3 style="margin:0 0 10px;font-size:16px" data-i18n="control.log">Comm Log</h3>
        <div class="log" id="atLog"></div>
        <div class="field" style="margin-top:12px">
          <input id="atCustom" data-i18n-placeholder="control.custom" placeholder="Custom AT…" />
          <button class="btn primary" id="atSend" data-i18n="control.send">Send</button>
        </div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn" data-at="AT+CONN?">AT+CONN?</button>
          <button class="btn" data-at="AT+SYSINFO?">AT+SYSINFO?</button>
          <button class="btn" data-at="AT+ERR?">AT+ERR?</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/ui/common.js"></script>
<script src="/ui/theme.js"></script>
<script src="/ui/i18n.js"></script>
<script>
// ── Toolbar ──
document.getElementById("themeBtn").onclick = function () {
  var t = RP.theme.toggle();
  document.getElementById("themeIcon").textContent = t === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
};
document.getElementById("langBtn").onclick = function () {
  RP.i18n.toggleLang();
  document.getElementById("langLabel").textContent = RP.i18n.currentLang() === "zh" ? "EN" : "\u4E2D\u6587";
};
(function () {
  document.getElementById("themeIcon").textContent = RP.theme.current() === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
  document.getElementById("langLabel").textContent = RP.i18n.currentLang() === "zh" ? "EN" : "\u4E2D\u6587";
  document.addEventListener("rp:themechange", function (e) {
    document.getElementById("themeIcon").textContent = e.detail === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
  });
  document.addEventListener("rp:langchange", function () {
    document.getElementById("langLabel").textContent = RP.i18n.currentLang() === "zh" ? "EN" : "\u4E2D\u6587";
  });
})();

// ── WebSocket & gamepad logic ──
var logEl = document.getElementById("atLog");
var ws, btnId = 1;

function log(line) {
  logEl.textContent += "[" + new Date().toLocaleTimeString() + "] " + line + "\n";
  logEl.scrollTop = logEl.scrollHeight;
}
function sendAt(line) {
  if (!ws || ws.readyState !== 1) { log(RP.i18n.t("control.not_connected")); return; }
  ws.send(line); log("\u2192 " + line);
}

// Button bindings
function bindFace(el) {
  var name = el.getAttribute("data-btn");
  if (!name) return;
  var down = function (e) { e.preventDefault(); el.classList.add("active"); sendAt("AT+BTN=" + name + ",down," + (btnId++)); };
  var up = function (e) { e.preventDefault(); el.classList.remove("active"); sendAt("AT+BTN=" + name + ",up," + (btnId++)); };
  el.addEventListener("pointerdown", down);
  el.addEventListener("pointerup", up);
  el.addEventListener("pointerleave", function () { el.classList.remove("active"); });
}
document.querySelectorAll(".gamepad [data-btn]").forEach(bindFace);

// Joysticks
function makeStick(groupId, knobId, axisX, axisY) {
  var g = document.getElementById(groupId);
  var knob = document.getElementById(knobId);
  var dragging = false, max = 18;
  function set(dx, dy) {
    var r = Math.hypot(dx, dy) || 1;
    var s = Math.min(1, max / r);
    dx *= s; dy *= s;
    knob.setAttribute("cx", dx);
    knob.setAttribute("cy", dy);
    var lx = +(dx / max).toFixed(3);
    var ly = +(-dy / max).toFixed(3);
    document.getElementById("joyHint").textContent = axisX + "=" + lx + "  " + axisY + "=" + ly;
    sendAt("AT+JOY=" + axisX + "," + lx);
    sendAt("AT+JOY=" + axisY + "," + ly);
  }
  g.addEventListener("pointerdown", function (e) {
    dragging = true; g.setPointerCapture(e.pointerId);
    var base = g.querySelector(".stick-base");
    var rect = base.getBoundingClientRect();
    set(e.clientX - (rect.left + rect.width/2), e.clientY - (rect.top + rect.height/2));
  });
  g.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var base = g.querySelector(".stick-base");
    var rect = base.getBoundingClientRect();
    set(e.clientX - (rect.left + rect.width/2), e.clientY - (rect.top + rect.height/2));
  });
  g.addEventListener("pointerup", function () { dragging = false; set(0,0); knob.setAttribute("cx",0); knob.setAttribute("cy",0); });
}
makeStick("lstick", "lknob", "lx", "ly");
makeStick("rstick", "rknob", "rx", "ry");

// AT buttons
document.querySelectorAll("[data-at]").forEach(function (b) {
  b.onclick = function () { sendAt(b.dataset.at); };
});
document.getElementById("atSend").onclick = function () {
  var v = document.getElementById("atCustom").value.trim();
  if (v) sendAt(v);
};

// WS
function connectWs() {
  var proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/ws");
  ws.onopen = function () {
    RP.setPill(document.getElementById("wsPill"), RP.i18n.t("nav.connected"), "ok");
    log("WS open");
  };
  ws.onclose = function () {
    RP.setPill(document.getElementById("wsPill"), RP.i18n.t("nav.disconnected"), "bad");
    setTimeout(connectWs, 1500);
  };
  ws.onmessage = function (ev) {
    var msg = String(ev.data);
    if (msg.startsWith("@")) return;
    log("\u2190 " + msg);
  };
}
connectWs();
</script>
</body>
</html>
