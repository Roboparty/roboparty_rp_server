name: Build RoboParty RP Server Deb Package

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Version check (__init__.py vs changelog)
        run: |
          INIT_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/rp_server/__init__.py)
          CHANGELOG_VERSION=$(head -1 debian/changelog | grep -oP '\((.*?)\)' | tr -d '()' | cut -d'-' -f1)

          echo "__init__.py version: $INIT_VERSION"
          echo "changelog version:   $CHANGELOG_VERSION"

          if [ "$INIT_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Version mismatch! __init__.py=$INIT_VERSION, changelog=$CHANGELOG_VERSION"
            exit 1
          fi

          echo "✅ Version check passed: $INIT_VERSION"

      - name: Tag vs changelog version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CHANGELOG_VERSION=$(head -1 debian/changelog | grep -oP '\((.*?)\)' | tr -d '()' | cut -d'-' -f1)

          echo "Tag version:       $TAG_VERSION"
          echo "Changelog version: $CHANGELOG_VERSION"

          if [ "$TAG_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::Version mismatch! tag=v$TAG_VERSION, changelog=$CHANGELOG_VERSION"
            exit 1
          fi

          echo "✅ Tag matches changelog: v$TAG_VERSION"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev debhelper dh-make

      - name: Build deb package
        run: |
          dpkg-buildpackage -us -uc -b
          mv ../*.deb .
          VERSION=$(dpkg-parsechangelog -S Version | cut -d'-' -f1 || echo "unknown")
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up Python for proto wheel
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build roboparty-proto wheel
        run: |
          python3 -m pip install --upgrade build
          python3 scripts/build_proto_wheel.py
          ls -l dist/*.whl

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: roboparty-rp-server-v${{ env.PKG_VERSION }}-all
          path: "*.deb"

      - name: Upload proto wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: roboparty-proto
          path: "dist/*.whl"

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            dist/*.whl
