<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RoboParty · Chat</title>
<link rel="stylesheet" href="/ui/tokens.css" />
<link rel="stylesheet" href="/ui/common.css" />
</head>
<body>
<div class="shell">
  <!-- ── Nav ────────────────────────────────────────────── -->
  <nav class="nav">
    <div class="nav-brand">Robo<em>Party</em></div>
    <div class="nav-links">
      <a href="/" data-i18n="nav.home">Home</a>
      <a href="/control" data-i18n="nav.control">Gamepad</a>
      <a class="active" href="/chat-ui" data-i18n="nav.chat">Chat</a>
    </div>
    <div class="nav-tools">
      <button class="tool-btn" id="themeBtn" data-i18n-title="toolbar.theme" title="Toggle Theme" aria-label="Toggle theme">
        <span class="tool-icon" id="themeIcon">☀️</span>
      </button>
      <button class="tool-btn" id="langBtn" data-i18n-title="toolbar.lang" title="Switch language" aria-label="Switch language">
        <span id="langLabel">EN</span>
      </button>
      <span id="batPill" class="pill"><span class="dot"></span><span data-i18n="nav.battery">Battery</span> &mdash;</span>
    </div>
  </nav>

  <main class="page" style="padding-top:18px">
    <div class="chat-layout">
      <div class="chat-top">
        <div>
          <h2 data-i18n="chat.title">Robot Assistant</h2>
          <div style="font-size:12px;color:var(--text-secondary);margin-top:2px" id="sessionHint" data-i18n="chat.gateway">DeepSeek · V4 Flash</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="modelSelect" class="btn ghost" style="min-width:140px">
            <option value="deepseek-v4-flash">V4 Flash</option>
            <option value="deepseek-v4-pro">V4 Pro</option>
          </select>
          <button class="btn ghost" id="clearBtn" type="button" data-i18n="chat.new_session">New Session</button>
        </div>
      </div>
      <div class="chat-stream" id="chatBox"></div>
      <div class="chat-input">
        <input id="chatInput" data-i18n-placeholder="chat.placeholder" placeholder="Type a message, Enter to send…" autocomplete="off" />
        <button class="btn primary" id="chatSend" data-i18n="chat.send">Send</button>
      </div>
    </div>
  </main>
</div>

<script src="/ui/common.js"></script>
<script src="/ui/theme.js"></script>
<script src="/ui/i18n.js"></script>
<script>
// ── Toolbar ──
document.getElementById("themeBtn").onclick = function () {
  var t = RP.theme.toggle();
  document.getElementById("themeIcon").textContent = t === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
};
document.getElementById("langBtn").onclick = function () {
  RP.i18n.toggleLang();
  document.getElementById("langLabel").textContent = RP.i18n.currentLang() === "zh" ? "EN" : "\u4E2D\u6587";
};
(function () {
  document.getElementById("themeIcon").textContent = RP.theme.current() === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
  document.getElementById("langLabel").textContent = RP.i18n.currentLang() === "zh" ? "EN" : "\u4E2D\u6587";
  document.addEventListener("rp:themechange", function (e) {
    document.getElementById("themeIcon").textContent = e.detail === "light" ? "\uD83C\uDF19" : "\u2600\uFE0F";
  });
  document.addEventListener("rp:langchange", function () {
    document.getElementById("langLabel").textContent = RP.i18n.currentLang() === "zh" ? "EN" : "\u4E2D\u6587";
  });
})();

// ── Chat logic ──
var sessionId = null;
var box = document.getElementById("chatBox");

function addMsg(role, text) {
  var row = document.createElement("div");
  row.className = "bubble-row " + (role === "user" ? "user" : "bot");
  var b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  var input = document.getElementById("chatInput");
  var msg = input.value.trim();
  if (!msg) return;
  input.value = "";
  addMsg("user", msg);
  try {
    var body = {
      message: msg,
      model: document.getElementById("modelSelect").value,
    };
    if (sessionId) body.session_id = sessionId;
    var res = await RP.api("/chat", { method: "POST", body: JSON.stringify(body) });
    sessionId = res.session_id;
    document.getElementById("sessionHint").textContent = res.mock
      ? RP.i18n.t("chat.gateway.mock")
      : RP.i18n.t("chat.gateway.live") + " · " + (res.model || body.model);
    addMsg("bot", res.reply);
  } catch (e) {
    addMsg("bot", RP.i18n.t("chat.error") + e.message);
  }
}

document.getElementById("chatSend").onclick = sendChat;
document.getElementById("chatInput").onkeydown = function (e) { if (e.key === "Enter") sendChat(); };
document.getElementById("clearBtn").onclick = function () {
  sessionId = null;
  box.innerHTML = "";
  document.getElementById("sessionHint").textContent = RP.i18n.t("chat.new_started");
};

// Light status via WS
(function () {
  var proto = location.protocol === "https:" ? "wss" : "ws";
  var ws = new WebSocket(proto + "://" + location.host + "/ws");
  ws.onmessage = function (ev) {
    var msg = String(ev.data);
    if (msg.startsWith("@BAT")) {
      var p = msg.split(/\s+/);
      var pct = Number(p[3]);
      RP.setPill(
        document.getElementById("batPill"),
        RP.i18n.t("nav.power") + " " + pct + "%",
        pct < 20 ? "bad" : "ok"
      );
    }
  };
})();

// Greeting
addMsg("bot", RP.i18n.t("chat.greeting"));
</script>
</body>
</html>
