# RoboParty RP Server — server config
transports:
  ws: true
  serial: false
  bluetooth: false
  udp: false              # Legacy paths cannot participate in control leases.

server:
  host: "0.0.0.0"
  port: 9000
  # true: skip hardware pybind, push synthetic telemetry (dev / CI)
  mock: false

auth:
  # Native WS/HTTP clients send Authorization: Bearer $RP_SERVICE_TOKEN.
  # Configure a random token (>=32 chars) in the protected service environment.
  # Paired App JWTs also work. No localhost authentication bypass.
  service_scopes: [read, control, admin]  # admin lets the local MCP service use reset.

control:
  lease_ttl_s: 3.0
  input_timeout_s: 0.5    # Heartbeats do not renew control-frame freshness.

robot:
  # ROS 2 package name uses underscores (roboparty_inference). {policy} is
  # replaced by the validated PolicyCommand.name; keep robot in sync with
  # /opt/roboparty/share/roboparty_inference/robots/<robot>/robot.yaml.
  # 产品启动统一委托 roboparty-start；--foreground 让 PolicyDriver 管理整个进程组。
  launch_cmd: "/opt/roboparty/bin/start_robot.sh --foreground --robot rpo --policy {policy}"
  # STATE_RUNNING is returned only after this service is visible. If ros2 is
  # missing or the probe fails, startup fails closed instead of reporting
  # process-only success.
  ready_service: "start_inference"
  ready_timeout_s: 15
  # System-wide coordination lock: inference, start/deploy, TUI maintenance and
  # flashing all use the same path. Keep it on tmpfs so root and robo can open
  # the same inode without creating /run/lock entries at package time.
  control_lock: "/dev/shm/roboparty-control.lock"
  # Development only: bypass the cross-process control lock so a policy can be
  # started even when start_robot.sh / another maintenance task holds it.
  # Never enable on a robot that may be operated concurrently. Can also be
  # enabled with RP_DEVELOPER_MODE=1.
  developer_mode: false

# 日志配置
logging:
  level: "INFO"           # 日志级别: DEBUG/INFO/WARNING/ERROR/CRITICAL
  dir: "logs"             # 日志文件目录
  file: "rp_server.log"   # 主日志文件名
  packet_file: "packets.log"  # 数据包日志文件名
  max_size: 10485760      # 单个日志文件最大大小 (字节), 10MB
  backup_count: 5         # 保留的备份文件数量

# 本机结构化日志服务（hex/roboparty_log_server）；持久 spool，best-effort，不阻塞控制。
# 可设 enabled: false 或 RP_LOG_SERVER_URL 覆盖/关闭。
log_server:
  enabled: true
  url: "http://127.0.0.1:8092"
  token: ""               # 或 RP_LOG_TOKEN
  device_id: ""           # 或 RP_LOG_DEVICE_ID；留空用 hostname
  device_model: ""        # 或 RP_DEVICE_MODEL
  firmware_version: ""    # 或 RP_FIRMWARE_VERSION
  service: "rp_server"
  level: "INFO"
  spool_path: ""         # 留空用 logging.dir/log-spool.sqlite3
  spool_max_events: 10000
  max_attempts: 20
  # 公网匿名模式：先显式同意，再按 event_type/字段白名单脱敏；默认关闭。
  public: false
  public_consent: false
  public_alias: "robot"
  public_event_types: ["startup", "lease", "inference", "policy", "command", "skill", "log"]
  public_fields: ["logger", "module", "function", "line"]
  batch_size: 50
  flush_interval_s: 2.0
  timeout_s: 5.0

hardware:
  # Normal service stays available in degraded mode when devices are unplugged.
  # Use --require-hardware during hardware acceptance testing.
  required: ["motors", "imu"]
  fail_startup_if_unavailable: false

serial:
  port: "/dev/ttyAMA0"
  baudrate: 115200

bluetooth:
  channel: 1

udp:
  host: "0.0.0.0"
  port: 9000
  auth:
    # 生产环境请留空并通过 /etc/rp-server/rp-server.env 的 RP_UDP_SECRET
    # 或环境变量注入；留空时服务会生成随机密钥（重启后失效）。
    secret_key: ""
    token_ttl: 3600  # Token有效期（秒）
  session_timeout: 10  # 会话超时（秒）

telemetry:
  imu_hz: 50
  battery_hz: 50
  motor_hz: 1      # motor states broadcast; sampled together with errors
  error_hz: 10     # motor_error_push broadcast

# inference 分段遥测：每次 policy 启动到停止一个分段，本地落盘，不自动上传。
segments:
  enabled: true
  dir: ""                 # 留空用 logging.dir/segments
  pre_window_s: 5         # 启动前保留
  post_window_s: 5        # 停止后继续记录
  buffer_s: 10            # 无分段时的内存环形窗口

tls:
  # WSS/TLS for /ws-json (and /ws). v2 requires TLS; a self-signed
  # certificate with local SANs is generated on first start if missing.
  enabled: true
  certfile: "/etc/rp-server/auth/tls.crt"
  keyfile: "/etc/rp-server/auth/tls.key"

identity:
  # Per-robot Ed25519 key. Generated on first start; mode 0600.
  # Never commit this file; provision one per board.
  device_key: "/etc/rp-server/auth/device.key"
  # QR/software SN written by scripts/provision_software_sn.py.
  software_sn: "/etc/roboparty/robot-sn"
  # Registered app public keys (0600).
  apps_path: "/etc/rp-server/auth/apps.json"

pairing:
  # Single-owner: a successful new pairing revokes previous user app keys.
  # Admin-scoped keys are preserved unless preserve_admin is false.
  single_owner: true
  preserve_admin: true

tui:
  # Board-management backend: robopi-tui JSON-RPC (`robopi-tui rpc --protocol 1`).
  # Motion/telemetry stay in rp_server; this only proxies board tasks/snapshots.
  enabled: true
  executable: ""       # autodetect: RP_TUI_BIN, PATH, /opt/roboparty/bin/robopi-tui
  server: "rp_server"  # injected as RP_TUI_SERVER; appears in TUI backend results
  timeout_s: 120
  motor_cache_s: 2.0   # cache motors.get results for /api/status and WHAT_ERRORS
  identity_cache_s: 60 # cache TUI identity for GET /identity
  allow_jobs: false    # true enables jobs.start/acknowledge (apt upgrade / HPM flash)

gamepad:
  # Default WS target for on-board bridge
  ws_url: "ws://127.0.0.1:9000/ws"

# can_top is preconfigured by the system for CAN FD: 1 Mbps nominal, 5 Mbps data
can_gamepad:
  enabled: false         # Direct legacy input bypasses ownership; use leased WS.
  interface: "can_top"
  can_id: 0x003
  payloads:
    - "010001AA00000000" #
    - "010001AA00000001"
  click_ms: 50
